# ─────────────────────────────────────────────────────────────────────────
# LibriSpeech evaluation config — all 4 splits.
#
# Used by:  bash scripts/evaluation/run_evaluation.sh --config <this>
# ─────────────────────────────────────────────────────────────────────────

data_alias: libri960              # override via --data libri100 on the CLI

splits:
  - test-clean
  - test-other
  - dev-clean
  - dev-other

# Maximum bucket size (seconds) used by the eval dataloader. Larger than
# training because we can afford less padding at inference time.
max_duration: 350.0

# Optional overrides for the datamodule. Anything you set here wins over the
# fields baked into the training checkpoint's config.
data:
  num_buckets: 20
  min_seconds: 0.0
  max_seconds: 30.0
  apply_spec_augment: false
  per_utt_mvn: true
