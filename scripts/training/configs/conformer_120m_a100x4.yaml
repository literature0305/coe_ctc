# ─────────────────────────────────────────────────────────────────────────
# Conformer-CTC SMALL (~120M) — A100 × 4 profile.
# Target: LibriSpeech 960h, BPE 3000.
# Expected: WER ~2.6 % test-clean, ~6.0 % test-other (matches IceFall).
# ─────────────────────────────────────────────────────────────────────────

output_dir: outputs/ctc_conformer_120m_3000bpe

model:
  arch: conformer
  size: small
  head_dropout: 0.0
  blank_idx: 0

data:
  num_features: 80
  manifest_dir: downloads/manifests/libri960
  feats_dir: downloads/feats/libri960_fbank80
  manifest_prefix: librispeech
  bpe_model: downloads/bpe/libri960_bpe3000/spm.model
  train_parts: ["train-clean-100", "train-clean-360", "train-other-500"]
  dev_part: dev-other
  test_parts: ["test-clean", "test-other", "dev-clean", "dev-other"]
  max_duration: 350.0           # ~80 GB usage per A100 with bf16
  num_buckets: 30
  min_seconds: 1.0
  max_seconds: 20.0
  apply_spec_augment: true
  spec_aug_num_freq_masks: 2
  spec_aug_freq_mask_param: 27
  spec_aug_num_time_masks: 10
  spec_aug_time_mask_param: 100
  spec_aug_time_mask_ratio: 0.04
  per_utt_mvn: true
  num_workers: 6
  pin_memory: true
  persistent_workers: true

optim:
  name: adamw
  lr: 1.5e-3
  betas: [0.9, 0.98]
  eps: 1.0e-9
  weight_decay: 1.0e-2
  fused: true
  scheduler: warmup_cosine
  warmup_steps: 25000
  max_steps: 400000
  min_lr_ratio: 0.01
  grad_accum_steps: 1
  max_grad_norm: 5.0

amp:
  enabled: true
  dtype: bfloat16

checkpoint:
  save_every_steps: 5000
  rolling_keep: 3
  top_k: 10

validation:
  every_epochs: 1
  num_samples: 10

health:
  interval_steps: 100

seed: 42
distributed_backend: nccl
